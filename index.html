<meta charset="utf-8">
<title>Radar Lab Sezioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap">
<style>
/* Layout: banco di prova — toolbar scura in alto, sotto lo stage Radar (a tutta larghezza su desktop, in cornice telefono su mobile).
   Token ripresi dalla pagina live quotidiano.net/radar (25.11.2026). QN Shinka Display non è caricabile qui: fallback Source Serif 4. */
:root{
  --fg:#16181b; --fg-rgb:22,24,27; --muted:#5c636c; --tert:#9098a1; --hair:rgba(var(--fg-rgb),.1);
  --bg:#fff; --bg-2:#f7f8f9; --accent:#0092cc; --brand:#0088ff; --glow:0,146,204; --glass:rgba(var(--surface-rgb),.86);
  --ws:#e3e8eb; --ink:#0e0f11; --ink-2:#1f2226; --ink-3:#2a2e33; --ink-fg:#f4f7fb; --ink-muted:#9098a1; --radar-accent:#1fbaed;
  --serif:"QN Shinka Display","Source Serif 4",Georgia,"Times New Roman",serif;
  --serif-text:"QN Shinka","Source Serif 4",Georgia,"Times New Roman",serif;
  --label:600 11px/1.3 var(--sans); --label-ls:.12em;
  --sans:"Instrument Sans",Arial,Helvetica,sans-serif;
  --e:cubic-bezier(.3,.8,.1,1); --ei:cubic-bezier(.77,0,.175,1); --eo:cubic-bezier(.55,0,.75,.2);
  --turn:.85s;
  --card-shadow:0 1px 0 #ffffffb3 inset,0 18px 30px -12px #16181b29,0 48px 90px -20px #16181b24,0 90px 140px -30px #003c5a1f;
  --pop-shadow:0 10px 24px -12px rgba(0,0,0,.35),0 30px 60px -30px rgba(0,60,90,.25);
  --surface:#fff; --surface-rgb:255,255,255; --qn-chip:#0f3a6b; --qn-mark:#0f3a6b; --ph-bg:#dff1f9;
  color-scheme:light;
}
/* Tema scuro dello stage: token “strip-radar” già presenti nel CSS di produzione di Radar (ma oggi non applicati).
   Si attiva con prefers-color-scheme (modalità Auto) o con il selettore Tema della toolbar. */
.frame[data-theme="dark"]{
  --bg:#060e11; --bg-2:#0f1c22; --surface:#0b181d; --surface-rgb:11,24,29;
  --fg:#dfe8ec; --fg-rgb:223,232,236; --muted:#9fb3ba; --tert:#6f858d; --hair:rgba(199,240,250,.12);
  --accent:#1fbaed; --glow:0,187,242; --glass:rgba(11,24,29,.86);
  --qn-chip:#113c6f; --qn-mark:#8cc9ff; --ph-bg:#0e2a35;
  --card-shadow:0 1px 0 rgba(199,240,250,.06) inset,0 0 0 1px rgba(128,222,255,.07),0 24px 50px -20px rgba(0,0,0,.75),0 60px 120px -40px rgba(0,120,170,.18);
  --pop-shadow:0 14px 30px -12px rgba(0,0,0,.75),0 0 0 1px rgba(128,222,255,.06);
  color-scheme:dark;
}
.frame[data-theme="dark"] :is(.ph,.th,.pv-th) svg{filter:invert(1) hue-rotate(180deg) saturate(.85) brightness(.92)}
.frame[data-theme="dark"] :is(.ph,.th,.pv-th) img{filter:brightness(.86) saturate(.95)}
.frame[data-theme="dark"] .scrim{background:rgba(0,0,0,.55)}
.frame[data-theme="dark"] .card{border-color:rgba(128,222,255,.1)}
.frame[data-theme="dark"] .slot:not([data-focused="true"]) .card{opacity:.32}
body[data-stage-theme="dark"]{--ws:#15191c}
.frame{transition:background-color .35s}
html,body{height:100%}
body{margin:0;background:var(--ws);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Toolbar del banco di prova ---------- */
.tb{flex:none;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none;font-size:13px}
.tb::-webkit-scrollbar{display:none}
.tb-brand{font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center;margin-right:6px}
.tb-brand i{width:8px;height:8px;border-radius:50%;background:var(--radar-accent);box-shadow:0 0 10px 2px rgba(31,186,237,.6)}
.tb-brand small{color:var(--ink-muted);font-weight:500;font-size:12px}
.seg{display:flex;background:var(--ink-2);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;color:var(--ink-muted);font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.seg button b{font-weight:700;margin-right:5px}
.seg button:hover{color:var(--ink-fg)}
.seg button[aria-checked="true"]{background:var(--ink-fg);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--radar-accent);outline-offset:2px}
.tb-sp{flex:1 0 8px}
.tb-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;color:var(--ink-fg);background:var(--ink-2);white-space:nowrap;font-weight:500}
.tb-btn:hover{background:var(--ink-3)}
.tb-btn:focus-visible{outline:2px solid var(--radar-accent);outline-offset:2px}
.tb-btn[aria-pressed="true"]{background:var(--ink-fg);color:var(--ink)}
.tb-btn .sw{width:26px;height:14px;border-radius:9px;background:var(--ink-3);position:relative;transition:background .2s}
.tb-btn .sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-muted);transition:translate .25s var(--e),background .2s}
.tb-btn[aria-pressed="true"] .sw{background:var(--radar-accent)}
.tb-btn[aria-pressed="true"] .sw::after{translate:12px 0;background:var(--surface)}
.tb-desc{flex:none;background:var(--ink);color:var(--ink-muted);border-top:1px solid #ffffff12;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;line-height:1.45;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.tb-desc strong{color:var(--ink-fg);font-weight:600}
.tb-desc .how{color:#c7d0d8}
.tb-desc kbd{font:600 11px var(--sans);border:1px solid #ffffff30;border-radius:4px;padding:0 4px;color:var(--ink-fg)}

/* ---------- Workspace e cornice ---------- */
.ws{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;overflow:clip}
.frame{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;overflow:clip;isolation:isolate;color:var(--fg);touch-action:pan-y}
body[data-view="mobile"] .frame{width:390px;height:min(820px,calc(100% - 44px));border-radius:34px;box-shadow:0 0 0 9px #16181b,0 0 0 10px #3d434a,0 30px 80px -20px rgba(0,0,0,.4)}
@media (max-width:760px){
  body[data-view] .frame{width:100%;height:100%;border-radius:0;box-shadow:none}
  .seg-view{display:none}
  .tb-desc .how{display:none}
}

/* Note di progetto */
.notes{position:absolute;top:12px;right:12px;bottom:12px;width:min(380px,calc(100% - 24px));background:var(--ink);color:#c7d0d8;border-radius:16px;z-index:200;padding:22px 22px 26px;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);font-size:13.5px;line-height:1.55;translate:calc(100% + 24px) 0;transition:translate .5s var(--e);visibility:hidden}
.notes.open{translate:0 0;visibility:visible}
.notes h2{font:600 22px/1.2 var(--serif);color:var(--ink-fg);margin:0 0 4px}
.notes h3{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--radar-accent);margin:20px 0 6px}
.notes p,.notes ul{margin:0 0 8px}
.notes ul{padding-left:18px}
.notes li{margin-bottom:4px}
.notes .x{position:absolute;top:14px;right:14px;all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--ink-2);color:var(--ink-fg)}
.notes .x{position:absolute;top:14px;right:14px}
.notes .x:focus-visible{outline:2px solid var(--radar-accent)}
.notes .gen{border-top:1px solid #ffffff1a;margin-top:22px;padding-top:6px;color:var(--ink-muted);font-size:12.5px}

/* ---------- Stage Radar (condiviso) ---------- */
.qh{position:absolute;inset:0 0 auto;height:var(--hh);display:flex;align-items:center;padding:0 28px;z-index:40;background:linear-gradient(180deg,var(--surface) 0%,rgba(var(--surface-rgb),.78) 100%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(var(--fg-rgb),.07)}
.qh-l,.qh-r{flex:1;display:flex;align-items:center;gap:20px;min-width:0}
.qh-r{justify-content:flex-end}
.burger{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px}
.qh-l a{font:500 15px var(--serif);color:var(--fg);text-decoration:none}
.logo{font:700 44px/1 var(--serif);letter-spacing:-.06em;color:var(--fg);text-decoration:none;flex:none}
.logo span{display:inline-block;transform:translateY(2px)}
.dateline{color:var(--accent);font-weight:500;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.frame[data-layout="m"] .qh{padding:0 16px}
.frame[data-layout="m"] .qh-l a{display:none}
.frame[data-layout="m"] .logo{font-size:34px}
.frame[data-layout="m"] .dateline{font-size:13px}

.plate{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.rings{position:absolute;inset:0;width:100%;height:100%}
.rings circle{fill:none;stroke:var(--accent);stroke-width:1}
.core{position:absolute;left:var(--pcx,var(--cx));top:var(--cy);width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;background:radial-gradient(circle,rgba(var(--glow),.22) 0%,rgba(var(--glow),.07) 45%,transparent 72%)}
.axis{position:absolute;left:0;right:0;top:calc(var(--cy) - 1px);height:2px;background:linear-gradient(to right,transparent 0%,rgba(var(--glow),.5) 30%,rgba(var(--glow),.12) 100%)}
.frame[data-layout="m"] .axis{display:none}
.beam{position:absolute;left:var(--pcx,var(--cx));top:var(--cy);width:var(--bs);height:var(--bs);margin:calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);border-radius:50%;background:conic-gradient(from 0deg,rgba(var(--glow),0) 0deg,rgba(var(--glow),0) 290deg,rgba(var(--glow),.08) 340deg,rgba(var(--glow),.26) 359.4deg,rgba(var(--glow),0) 360deg);-webkit-mask:radial-gradient(circle,#000 0%,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 0%,#000 25%,transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{rotate:360deg}}
.ping{position:absolute;left:var(--pcx,var(--cx));top:var(--cy);width:var(--bs);height:var(--bs);margin:calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);border-radius:50%;box-shadow:inset 0 0 0 2px rgba(var(--glow),.7),inset 0 0 40px rgba(var(--glow),.18);opacity:0;scale:.02}
.ping.go{animation:ping 1.15s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ping{0%{opacity:.95;scale:.02}70%{opacity:.35}100%{opacity:0;scale:.62}}
.blip{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#7fdcff 45%,var(--accent) 100%);opacity:0;animation:blip 7s linear infinite}
@keyframes blip{0%,60%{opacity:0;box-shadow:none;scale:.6}63%{opacity:1;scale:1.5;box-shadow:0 0 14px 6px rgba(var(--glow),.85),0 0 38px 16px rgba(var(--glow),.3)}75%{opacity:.9;scale:1;box-shadow:0 0 8px 3px rgba(var(--glow),.5)}100%{opacity:0;scale:.8}}

.wordmark{position:absolute;margin:0;font:400 var(--wm,96px)/1 var(--serif);letter-spacing:-.01em;z-index:5;pointer-events:none;color:var(--fg);white-space:nowrap;transition:font-size .5s var(--e),left .5s var(--e)}
.frame[data-layout="d"] .wordmark{left:var(--wmx,14px);top:var(--cy);writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg)}
.frame[data-layout="m"] .wordmark{left:50%;top:var(--wmy);transform:translate(-50%,0);font-size:44px;color:rgba(var(--fg-rgb),.26)}
.frame[data-layout="m"] .wordmark[data-hide]{display:none}

.zone{position:absolute;inset:0;z-index:4}
.wheel{position:absolute;left:var(--cx);top:var(--cy);width:0;height:0;rotate:var(--rot,0deg);transition:rotate .95s var(--e),opacity .45s ease-out}
.wheel.in{opacity:0;transition:none}
.wheel.out{opacity:0;transition:rotate .55s var(--eo),opacity .3s ease-in;pointer-events:none}
.wheel.bump{animation:bump .42s var(--e)}
@keyframes bump{30%{rotate:var(--bumpr)}}
.slot{position:absolute;left:0;top:0;rotate:calc(var(--off) * var(--theta));transition:rotate var(--turn) var(--e);z-index:calc(10 - var(--abs))}
.slot[data-far]{visibility:hidden}
.card{position:absolute;width:var(--cw);height:var(--ch);left:calc(var(--R) - var(--cw) / 2);top:calc(var(--ch) / -2);background:var(--surface);border:1px solid rgba(var(--fg-rgb),.08);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:40% minmax(0,1fr);opacity:.4;transition:opacity var(--turn) var(--ei),box-shadow .6s var(--e);cursor:pointer;margin:0}
.slot[data-focused="true"] .card{opacity:1;box-shadow:var(--card-shadow);cursor:default}
.frame[data-layout="m"] .card{left:calc(var(--cw) / -2);top:calc(-1 * var(--R) - var(--ch) / 2);grid-template-columns:1fr;grid-template-rows:38% minmax(0,1fr);border-radius:14px}
.ph{position:relative;overflow:hidden;background:var(--ph-bg)}
.ph svg{position:absolute;inset:0;width:100%;height:100%;display:block}
:is(.ph,.th,.pv-th) img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sm{margin:0;font:400 15px/1.5 var(--serif-text);text-wrap:pretty;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:0;flex:0 1 auto}
.frame[data-layout="m"] .sm{font-size:14px;-webkit-line-clamp:2}
.frame[data-layout="m"] .tt{-webkit-line-clamp:3}
.tx{padding:22px 24px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kick{margin:0;font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px;flex-wrap:wrap}
.kick .sec{font-weight:600}
.kick .sec::after{content:"·";margin-left:8px;color:var(--tert)}
.tt{margin:0;flex:none;font:600 var(--tfs,30px)/1.12 var(--serif);letter-spacing:-.005em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tt button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:5px;text-decoration-thickness:1px;transition:text-decoration-color .2s}
.tt button:hover{text-decoration-color:var(--accent)}
.tt button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.by{margin:auto 0 0;flex:none;font:400 13px/1.4 var(--sans);color:var(--muted)}
.by b{font-weight:600;color:var(--fg)}
.frame[data-layout="m"] .tx{padding:16px 18px 16px;gap:8px}
.frame[data-layout="m"] .kick{font-size:11px}
/* Card: proporzioni e tipografia riprese dalla pagina live (desktop in scala con --k) */
.card{border-radius:calc(18px * var(--k,1));grid-template-columns:43.8% minmax(0,1fr);opacity:.45}
.frame[data-layout="d"] .tx{padding:calc(32px * var(--k)) calc(36px * var(--k)) calc(28px * var(--k));gap:calc(14px * var(--k))}
.frame[data-layout="d"] .kick{font-size:calc(13px * var(--k));letter-spacing:.15em;text-transform:none;line-height:1.45}
.frame[data-layout="d"] .tt{line-height:1.15;-webkit-line-clamp:5}
.frame[data-layout="d"] .sm{font-size:calc(19px * var(--k));line-height:1.5;-webkit-line-clamp:3}
.frame[data-layout="d"] .by{font-size:max(12px, calc(15px * var(--k)))}
.frame[data-layout="m"] .card{grid-template-rows:43% minmax(0,1fr);border-radius:18px}
.frame[data-layout="m"] .tx{padding:18px;gap:8px}
.frame[data-layout="m"] .kick{font-size:11px;letter-spacing:.12em;text-transform:none}
.frame[data-layout="m"] .tt{line-height:1.15;-webkit-line-clamp:5}
.frame[data-layout="m"] .sm{display:none} /* come sul live: su mobile il lead non c'è */
/* card non attive, come sul live: foto in bianco e nero velata d'azzurro, testo attenuato */
.ph::after{content:"";position:absolute;inset:0;background:var(--accent);mix-blend-mode:color;opacity:0;transition:opacity var(--turn) var(--ei);pointer-events:none}
.ph img{transition:filter var(--turn) var(--ei)}
.slot:not([data-focused="true"]) .ph img{filter:saturate(0) brightness(1.04) contrast(.95)}
.slot:not([data-focused="true"]) .ph::after{opacity:1}
.tx{transition:opacity var(--turn) var(--ei)}
.slot:not([data-focused="true"]) .tx{opacity:.55}
.empty-card{grid-template-columns:1fr !important;grid-template-rows:1fr !important;place-items:center;text-align:center}
.empty-card .tx{align-items:center;justify-content:center;max-width:360px;margin:auto}
.empty-card .tt{font-size:26px}
.empty-card p{color:var(--muted);margin:0;font-size:14px;line-height:1.5}
.empty-card .reset{margin-top:8px;all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;border-bottom:1px solid currentColor}

.steps{position:absolute;z-index:8;display:flex;gap:8px;align-items:center}
.frame[data-layout="d"] .steps{right:32px;top:var(--cy);transform:translateY(-50%);flex-direction:column}
.frame[data-layout="m"] .steps{left:50%;top:var(--stepsy);transform:translateX(-50%)}
.stp{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;border:1px solid rgba(var(--fg-rgb),.16);background:var(--glass);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,color .2s,opacity .2s,scale .2s var(--e)}
.stp:hover{border-color:var(--accent);color:var(--accent)}
.stp:active{scale:.92}
.stp:disabled{opacity:.3;cursor:default;border-color:rgba(var(--fg-rgb),.16);color:var(--fg)}
.stp:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:50%}
.frame[data-layout="m"] .stp svg{rotate:-90deg}
.cnt{font:600 11px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.08em;min-width:46px;text-align:center}
.toast{position:absolute;left:50%;bottom:24px;translate:-50% 20px;opacity:0;z-index:90;background:var(--fg);color:var(--bg);font-size:13px;padding:10px 16px;border-radius:999px;transition:opacity .25s,translate .35s var(--e);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;translate:-50% 0}

/* ---------- Variante A · Quadrante ---------- */
.frame[data-variant="a"] .beam{display:none}
.a-bearing{position:absolute;left:var(--pcx,var(--cx));top:var(--cy);width:var(--bs);height:var(--bs);margin:calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);border-radius:50%;pointer-events:none;z-index:1;background:conic-gradient(from 90deg,rgba(var(--glow),.16) 0deg,rgba(var(--glow),0) 9deg,rgba(var(--glow),0) 342deg,rgba(var(--glow),.05) 352deg,rgba(var(--glow),.16) 360deg);-webkit-mask:radial-gradient(circle,#000 0%,#000 12%,transparent 55%);mask:radial-gradient(circle,#000 0%,#000 12%,transparent 55%);rotate:var(--brg,0deg);transition:rotate .75s var(--e)}
.needle{position:absolute;left:var(--pcx,var(--cx));top:var(--cy);height:2px;width:var(--len,200px);margin-top:-1px;transform-origin:0 50%;rotate:var(--ang,0deg);background:linear-gradient(to right,rgba(var(--glow),0),rgba(var(--glow),.85));pointer-events:none;z-index:6;transition:rotate .75s var(--e),width .75s var(--e)}
.needle::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px 4px rgba(var(--glow),.55)}
.needle.ghost{height:0;background:none;border-top:1px dashed rgba(var(--glow),.7);opacity:0;transition:opacity .2s,rotate .25s var(--e),width .25s var(--e)}
.needle.ghost::after{display:none}
.needle.ghost.on{opacity:1}
.a-hub{display:none}
.init-nav *,.init-nav *::before,.init-nav *::after{transition:none !important}
.a-hit{position:absolute;z-index:6;cursor:grab;touch-action:none}
.a-hit.drag{cursor:grabbing}
.dial{position:absolute;inset:0;pointer-events:none;z-index:7}
.di{all:unset;position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:baseline;gap:6px;padding:6px 10px 6px 14px;border-radius:8px;translate:var(--x) var(--y);transform:translateY(-50%);transition:translate .6s var(--e),opacity .4s;white-space:nowrap}
.di::before{content:"";position:absolute;left:-1px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:rgba(var(--fg-rgb),.25);transition:background .25s,box-shadow .25s,scale .3s var(--e)}
.di .nm{font:450 15px/1.15 var(--sans);color:var(--muted);transform-origin:0 60%;display:inline-block;transition:color .25s,transform .55s var(--e),font-weight .35s}
.di .ct{font:500 11px var(--sans);color:var(--tert);font-variant-numeric:tabular-nums;transition:opacity .3s,translate .55s var(--e)}
.di:hover .nm,.di.near .nm,.di:focus-visible .nm{color:var(--fg)}

.di[aria-selected="true"] .nm{color:var(--fg);font-weight:650;transform:scale(1.32)}

.di[aria-selected="true"]::before{background:var(--accent);box-shadow:0 0 10px 3px rgba(var(--glow),.55)}
.di[data-empty] .nm{color:var(--tert)}
.di[data-empty][aria-selected="true"] .nm{color:var(--muted)}
.di.reset .nm{font-style:italic;font-family:var(--serif);font-size:16px}
.a-tip{position:absolute;z-index:9;pointer-events:none;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(var(--fg-rgb),.12);border-radius:8px;padding:6px 10px;font:500 12px/1.3 var(--sans);box-shadow:var(--pop-shadow);opacity:0;translate:var(--tx,0) var(--ty,0);transition:opacity .15s,translate .2s var(--e);white-space:nowrap}
.a-tip.on{opacity:1}
.a-tip span{color:var(--muted)}
/* A mobile: ghiera orizzontale */
.frame[data-layout="m"] .a-hub,.frame[data-layout="m"] .needle,.frame[data-layout="m"] .a-bearing{display:none}
.frame[data-layout="m"] .dial{pointer-events:auto;top:auto;height:var(--dialh);bottom:0;touch-action:none;overflow:hidden}
.frame[data-layout="m"] .dial::before{content:"";position:absolute;left:50%;top:var(--arcTop);width:calc(var(--dr) * 2);height:calc(var(--dr) * 2);margin-left:calc(var(--dr) * -1);border-radius:50%;border:1px solid rgba(var(--glow),.35);background:radial-gradient(circle at 50% 0%,rgba(var(--glow),.12),transparent 40%);pointer-events:none}
.frame[data-layout="m"] .di{padding:8px 6px;transform:translate(-50%,-50%) rotate(var(--r,0deg));flex-direction:column;align-items:center;gap:1px;opacity:var(--o,1)}
.frame[data-layout="m"] .di::before{left:50%;top:auto;bottom:-6px;margin:0 0 0 -3px}
.frame[data-layout="m"] .di .nm{font-size:15px;transform-origin:50% 50%}
.frame[data-layout="m"] .di[aria-selected="true"] .nm{transform:scale(1.2)}
.frame[data-layout="m"] .di[aria-selected="true"] .ct{translate:0 3px}
.frame[data-layout="m"] .dial.drag .di{transition:none}
.notch{position:absolute;left:50%;width:0;height:0;margin-left:-6px;border:6px solid transparent;border-top:7px solid var(--accent);z-index:8;top:var(--notchy);filter:drop-shadow(0 0 4px rgba(var(--glow),.6))}

/* ---------- Variante B · Indice ---------- */
.b-trig{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 12px;border-radius:999px;border:1px solid rgba(var(--glow),.35);background:rgba(var(--glow),.06);transition:background .2s,border-color .2s,box-shadow .3s}
.b-trig:hover{background:rgba(var(--glow),.12);border-color:var(--accent)}
.b-trig:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.b-trig .lb{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.b-trig .cur{font:600 17px/1 var(--serif);color:var(--fg);display:inline-grid;overflow:hidden;height:20px;align-items:center}
.b-trig .cur span{grid-area:1/1;transition:translate .5s var(--e),opacity .3s}
.b-trig .cur span.old{translate:0 -110%;opacity:0}
.b-trig .cur span.new{animation:curIn .5s var(--e)}
@keyframes curIn{from{translate:0 110%;opacity:0}}
.b-trig .pl{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:rotate .5s var(--e)}
.b-trig[aria-expanded="true"] .pl{rotate:45deg}
.radar-glyph{width:18px;height:18px;flex:none}
/* rail di tacche (ripreso dal live, ora per sezioni) */
.b-rail{position:absolute;left:0;top:var(--cy);translate:0 -50%;z-index:9;display:flex;flex-direction:column;padding:8px 12px 8px 0;touch-action:none}
.b-mark{all:unset;height:13px;display:flex;align-items:center;cursor:pointer;padding-left:10px}
.b-mark i{display:block;height:2px;width:calc(10px + 16px * var(--k,0));background:rgba(var(--fg-rgb),calc(.3 + .5 * var(--k,0)));border-radius:2px;transition:width 90ms,background .15s}
.b-mark[aria-current="true"] i{background:var(--accent);height:3px}
.b-mark[data-empty] i{background:rgba(var(--fg-rgb),.14)}
.b-mark:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.b-rail .lbl{position:absolute;left:calc(100% - 4px);top:0;translate:0 calc(var(--y,0px) - 50%);white-space:nowrap;font:500 12px/1.2 var(--sans);background:var(--glass);border:1px solid rgba(var(--fg-rgb),.14);backdrop-filter:blur(14px) saturate(160%);border-radius:8px;padding:6px 10px;opacity:0;pointer-events:none;transition:translate .16s var(--e),opacity .12s;box-shadow:var(--pop-shadow)}
.b-rail .lbl span{color:var(--muted);margin-left:6px}
.b-rail[data-hot="true"] .lbl{opacity:1}
.frame[data-variant="b"][data-layout="d"] .wordmark{--wmx:30px}
/* overlay indice */
.idx{position:absolute;inset:0;z-index:60;background:rgba(var(--surface-rgb),.9);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);clip-path:circle(0px at var(--ox) var(--oy));transition:clip-path .65s var(--e)}
.idx.open{clip-path:circle(var(--or) at var(--ox) var(--oy))}
.idx.closing{transition:clip-path .42s var(--ei)}
.idx-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 32px 28px 64px}
.idx-top{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.eyebrow{margin:0;font:var(--label);letter-spacing:var(--label-ls);text-transform:uppercase;color:var(--muted)}
.idx-x{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font:500 13px var(--sans);color:var(--muted);padding:6px 6px 6px 12px;border-radius:999px}
.idx-x:hover{color:var(--fg)}
.idx-x kbd{font:600 10px var(--sans);border:1px solid var(--hair);border-radius:4px;padding:1px 5px}
.idx-x .pl{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;rotate:45deg}
.idx-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:64px;align-items:center}
.idx-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:100%;overflow:auto;scrollbar-width:thin}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:var(--rowpad,10px) 6px var(--rowpad,10px) 0;border-bottom:1px solid var(--hair);border-radius:0}
.row .bar{flex:none;width:10px;height:2px;background:rgba(var(--fg-rgb),.3);border-radius:2px;transition:width .35s var(--e),background .2s,height .2s}
.row .nm{font:500 var(--rowfs,40px)/1.05 var(--serif);letter-spacing:-.012em;transition:translate .45s var(--e),color .2s;color:var(--fg)}
.row .ct{margin-left:auto;font:500 12px var(--sans);color:var(--tert);font-variant-numeric:tabular-nums}
.row:hover .bar,.row.pv .bar{width:30px;background:var(--fg)}
.row:hover .nm,.row.pv .nm{translate:6px 0}
.row[aria-current="true"] .nm{color:var(--accent)}
.row[aria-current="true"] .bar{background:var(--accent);height:3px;width:30px}
.row[data-empty] .nm{color:var(--tert)}
.row.reset .nm{font-style:italic}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.idx.open .idx-list li{animation:rowIn .55s var(--e) both;animation-delay:calc(140ms + var(--i) * 26ms)}
@keyframes rowIn{from{opacity:0;translate:0 12px}}
.idx-prev{align-self:center;max-width:470px;min-width:0;max-height:100%;overflow:auto;scrollbar-width:thin}
.idx-grid{overflow:hidden}
.frame[data-variant="d"] .pv-h{font-size:30px}
.frame[data-variant="d"] .pv-m{margin-bottom:10px}
.frame[data-variant="d"] .pv-list{margin-bottom:12px}
.idx-prev > *{animation:pvIn .45s var(--e) both}
.idx-prev > *:nth-child(2){animation-delay:30ms}.idx-prev > *:nth-child(3){animation-delay:60ms}.idx-prev > *:nth-child(4){animation-delay:90ms}.idx-prev > *:nth-child(5){animation-delay:120ms}
@keyframes pvIn{from{opacity:0;translate:0 8px}}
.pv-h{margin:6px 0 4px;font:600 34px/1.1 var(--serif)}
.pv-d{margin:0 0 6px;color:var(--muted);font-size:15px;line-height:1.45}
.pv-m{margin:0 0 18px;font:500 12px var(--sans);color:var(--accent);letter-spacing:.04em}
.pv-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:4px}
.pv-it{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:8px;border-radius:12px;transition:background .2s}
.pv-it:hover,.pv-it:focus-visible{background:var(--bg-2)}
.pv-th{width:72px;height:54px;border-radius:8px;overflow:hidden;position:relative;background:var(--ph-bg)}
.pv-th svg{position:absolute;inset:0;width:100%;height:100%}
.pv-it .k{display:block;font:500 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.pv-it .t{display:block;font:600 17px/1.2 var(--serif);margin:3px 0;text-wrap:balance}
.pv-it .b{display:block;font-size:12px;color:var(--muted)}
.pv-all{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font:600 14px var(--sans);color:var(--bg);background:var(--fg);padding:11px 18px;border-radius:999px;transition:background .2s}
.pv-all:hover{background:var(--accent)}
.pv-all:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pv-empty{padding:18px;border:1px dashed var(--hair);border-radius:12px;color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:18px}
/* B mobile: pill + bottom sheet */
.b-pill{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:30;height:52px;padding:0 8px 0 16px;box-shadow:var(--pop-shadow);background:var(--glass);backdrop-filter:blur(14px);max-width:calc(100% - 32px)}
.b-pill .cur{max-width:170px}
.scrim{position:absolute;inset:0;z-index:70;background:rgba(14,15,17,.32);opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.scrim:not(.on),.e-scrim:not(.on){pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;height:88%;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.3);translate:0 100%;transition:translate .5s var(--e);display:flex;flex-direction:column}
.sheet.on{translate:0 var(--dy,0px)}
.sheet.drag{transition:none}
.grab{flex:none;height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:40px;height:5px;border-radius:3px;background:rgba(var(--fg-rgb),.2)}
.sh-top{flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px 20px;touch-action:none}
.sh-top h2{margin:0;font:600 26px/1 var(--serif)}
.sh-x{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2)}
.sh-list{list-style:none;margin:0;padding:0 8px 24px 20px;overflow:auto;flex:1;overscroll-behavior:contain}
.sr{border-bottom:1px solid var(--hair)}
.sr-h{display:flex;align-items:center}
.sr-main{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;padding:12px 0;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.sr-main .nm{font:500 22px/1.15 var(--serif)}
.sr-main .ct{font:500 12px var(--sans);color:var(--tert)}
.sr-main .ds{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-main[aria-current="true"] .nm{color:var(--accent)}
.sr-main[aria-current="true"] .nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;box-shadow:0 0 8px 2px rgba(var(--glow),.5)}
.sr[data-empty] .nm{color:var(--tert)}
.sr-exp{all:unset;cursor:pointer;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.sr-exp svg{transition:rotate .4s var(--e)}
.sr-exp[aria-expanded="true"] svg{rotate:180deg}
.sr-exp:focus-visible,.sr-main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sr-prev{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--e)}
.sr-prev.on{grid-template-rows:1fr}
.sr-prev > div{overflow:hidden}
.sr-prev ul{list-style:none;margin:0;padding:0 12px 14px 0;display:flex;flex-direction:column;gap:2px}
.sr-prev li button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:8px 10px;border-radius:10px;background:var(--bg-2)}
.sr-prev .t{display:block;font:600 15.5px/1.25 var(--serif)}
.sr-prev .b{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.sr-prev .none{font-size:13px;color:var(--muted);padding:4px 0 12px}

/* ---------- Variante C · Banda ---------- */
.c-band{position:absolute;left:0;right:0;z-index:35;background:rgba(var(--surface-rgb),.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.frame[data-layout="d"] .c-band{top:var(--hh);height:52px;border-bottom:1px solid rgba(var(--fg-rgb),.07)}
.c-in{position:relative;height:100%;display:flex;align-items:stretch;justify-content:center;padding:0 24px}
.c-tabs{position:relative;display:flex;align-items:stretch;min-width:0}
.ct-tab{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;gap:5px;padding:0 13px;white-space:nowrap;font:500 14.5px var(--sans);color:var(--muted);transition:color .2s}
.ct-tab sup{font-size:10px;color:var(--tert);font-variant-numeric:tabular-nums;top:-.4em;position:relative;vertical-align:baseline}
.ct-tab::after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:1px;background:rgba(var(--fg-rgb),.25);scale:0 1;transition:scale .3s var(--e)}
.ct-tab:hover{color:var(--fg)}
.ct-tab:hover::after{scale:1 1}
.ct-tab[aria-selected="true"]{color:var(--fg);font-weight:650}
.ct-tab[aria-selected="true"]::after{display:none}
.ct-tab[data-empty]{color:var(--tert)}
.ct-tab.ov{display:none}
.ct-tab.reset{font-family:var(--serif);font-style:italic;font-size:15.5px}
.ct-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-6px;border-radius:8px}
.c-ind{position:absolute;bottom:0;left:0;height:2px;width:var(--iw,0);translate:var(--ix,0) 0;background:var(--accent);border-radius:2px;transition:translate .5s var(--e),width .5s var(--e);pointer-events:none}
.c-ind::before{content:"";position:absolute;left:50%;top:-3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 3px rgba(var(--glow),.55)}
.c-more{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 13px;font:500 14.5px var(--sans);color:var(--muted);white-space:nowrap;position:relative}
.c-more:hover,.c-more[aria-expanded="true"]{color:var(--fg)}
.c-more.act{color:var(--fg);font-weight:650}
.c-more svg{transition:rotate .35s var(--e)}
.c-more[aria-expanded="true"] svg{rotate:180deg}
.c-more:focus-visible{outline:2px solid var(--accent);outline-offset:-6px;border-radius:8px}
.c-more[hidden]{display:none}
.c-menu{position:absolute;top:calc(100% + 8px);z-index:50;min-width:220px;background:var(--glass);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(var(--fg-rgb),.12);border-radius:12px;padding:6px;box-shadow:var(--pop-shadow);opacity:0;translate:0 -6px;scale:.98;transform-origin:top right;transition:opacity .18s,translate .25s var(--e),scale .25s var(--e);pointer-events:none}
.c-menu.on{opacity:1;translate:0 0;scale:1;pointer-events:auto}
.c-menu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:16px;width:100%;padding:9px 12px;border-radius:8px;font:500 14px var(--sans)}
.c-menu button:hover,.c-menu button:focus-visible{background:rgba(var(--glow),.08)}
.c-menu button[aria-selected="true"]{color:var(--accent);font-weight:650}
.c-menu button span{color:var(--tert);font-size:12px;font-variant-numeric:tabular-nums}
.c-tip{position:absolute;left:0;top:calc(100% + 10px);z-index:45;width:290px;background:var(--glass);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(var(--fg-rgb),.12);border-radius:12px;padding:12px 14px;box-shadow:var(--pop-shadow);pointer-events:none;opacity:0;translate:var(--tx,0) 4px;transition:opacity .16s,translate .28s var(--e)}
.c-tip.on{opacity:1;translate:var(--tx,0) 0}
.c-tip .m{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.c-tip .t{font:600 16px/1.25 var(--serif);margin:5px 0 4px}
.c-tip .d{font-size:12px;color:var(--muted)}
/* C mobile: banda in basso */
.frame[data-layout="m"] .c-band{bottom:0;height:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid rgba(var(--fg-rgb),.08);box-sizing:border-box}
.frame[data-layout="m"] .c-in{padding:0;justify-content:flex-start}
.frame[data-layout="m"] .c-tabs{flex:1;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%);mask:linear-gradient(to right,transparent 0,#000 18px,#000 calc(100% - 28px),transparent 100%);padding:0 18px}
.frame[data-layout="m"] .c-tabs::-webkit-scrollbar{display:none}
.frame[data-layout="m"] .ct-tab{scroll-snap-align:center;padding:0 12px;font-size:15px;flex:none}
.frame[data-layout="m"] .c-ind{top:0;bottom:auto}
.frame[data-layout="m"] .c-ind::before{top:auto;bottom:-3px}
.c-all{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:58px;display:grid;place-items:center;border-left:1px solid var(--hair);color:var(--fg)}
.c-all svg{transition:rotate .4s var(--e)}
.c-all[aria-expanded="true"] svg{rotate:45deg}
.c-all:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.c-grid{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:34;background:var(--surface);border-top:1px solid var(--hair);border-radius:20px 20px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.25);padding:18px 16px 14px;translate:0 calc(100% + 70px);transition:translate .5s var(--e);visibility:hidden}
.c-grid.on{translate:0 0;visibility:visible}
.c-grid .eyebrow{margin:0 4px 12px}
.c-grid ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.c-grid button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px;border-radius:10px;background:var(--bg-2);font:600 15px/1.2 var(--serif)}
.c-grid button span{font:500 11px var(--sans);color:var(--tert)}
.c-grid button[aria-selected="true"]{background:rgba(var(--glow),.1);color:var(--accent)}
.c-grid button[data-empty]{color:var(--tert)}
.c-grid li.wide{grid-column:1/-1}
.c-grid.on li{animation:rowIn .45s var(--e) both;animation-delay:calc(60ms + var(--i) * 22ms)}

/* ---------- Card di fine sezione (tutte le varianti) ---------- */
.end-card{background:linear-gradient(135deg,#fff 40%,#f2f9fc)}
.end-viz{position:relative;overflow:hidden;background:radial-gradient(circle at 0% 50%,rgba(var(--glow),.16),transparent 70%)}
.end-viz svg{position:absolute;inset:0;width:100%;height:100%}
.end-viz .sweep{transition:stroke-dashoffset 1.1s var(--e) .15s}
.slot[data-focused="true"] .end-viz .sweep{stroke-dashoffset:0}
.end-count{position:absolute;left:18px;bottom:14px;font:600 34px/1 var(--serif);color:var(--fg);font-variant-numeric:tabular-nums}
.end-count small{font-size:16px;color:var(--muted);margin-left:2px}
.end-sum{margin:0;font:500 15px/1.4 var(--sans);color:var(--muted)}
.end-next{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--hair)}
.nx-name{margin:2px 0 0;font:600 calc(var(--tfs) * 1.12)/1.05 var(--serif);letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.nx-ct{font:600 12px var(--sans);color:var(--accent);background:rgba(var(--glow),.1);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.nx-first{margin:4px 0 0;font-size:13px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx-first b{color:var(--fg);font-weight:600}
.end-act{display:flex;gap:14px 18px;align-items:center;flex-wrap:wrap;margin-top:auto}
.go-next{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;background:var(--fg);color:var(--bg);border-radius:999px;padding:11px 18px;font:600 14px var(--sans);transition:background .2s}
.go-next span{transition:translate .3s var(--e)}
.go-next:hover{background:var(--accent)}
.go-next:hover span{translate:4px 0}
.go-next:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .reset{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;border-bottom:1px solid currentColor}
.card .reset:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.empty-card .end-act{justify-content:center;margin-top:10px}
.frame[data-layout="m"] .end-card{grid-template-rows:24% minmax(0,1fr)}
.frame[data-layout="m"] .end-count{font-size:26px;left:14px;bottom:10px}
.frame[data-layout="m"] .end-sum{font-size:14px}

/* ---------- Variante D · Indice + Banda ---------- */
.frame[data-variant="d"] .ct-tab sup{top:0;margin-left:3px;font:600 11px var(--sans);color:var(--accent);background:rgba(var(--glow),.09);border-radius:999px;padding:2px 7px;transition:background .25s,color .25s}
.frame[data-variant="d"] .ct-tab[aria-selected="true"] sup{background:var(--accent);color:#fff}
.frame[data-variant="d"] .ct-tab[data-empty] sup{color:var(--tert);background:rgba(var(--fg-rgb),.05)}
.frame[data-variant="d"] .ct-tab.nx sup{background:var(--fg);color:var(--bg);animation:nxPulse 1.4s var(--e) infinite}
.frame[data-variant="d"] .ct-tab.nx{color:var(--fg)}
@keyframes nxPulse{50%{box-shadow:0 0 0 5px rgba(var(--glow),.18)}}
.frame[data-variant="d"] .c-ind{background:rgba(var(--glow),.2);overflow:visible}
.frame[data-variant="d"] .c-ind::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--prog,0) * 100%);background:var(--accent);border-radius:2px;transition:width .55s var(--e)}
.frame[data-variant="d"] .c-ind::before{left:calc(var(--prog,0) * 100%);transition:left .55s var(--e);z-index:1}
.frame[data-variant="d"][data-layout="d"] .c-in{justify-content:flex-start;padding-left:max(24px,calc(var(--wmx) - 4px))}
.d-idx{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;right:20px;top:50%;translate:0 -50%;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-radius:999px;border:1px solid rgba(var(--glow),.35);background:rgba(var(--glow),.06);font:600 13.5px var(--sans);color:var(--fg);transition:background .2s,border-color .2s}
.d-idx:hover{background:rgba(var(--glow),.12);border-color:var(--accent)}
.d-idx:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.d-idx .pl{width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:rotate .5s var(--e)}
.d-idx[aria-expanded="true"] .pl{rotate:45deg}
/* rail del tempo */
.d-rail{position:absolute;left:0;width:38px;height:var(--rh);z-index:9;touch-action:none;cursor:pointer}
.d-rail::before{content:"";position:absolute;left:10px;top:-10px;bottom:-10px;width:1px;background:linear-gradient(transparent,rgba(var(--fg-rgb),.12) 12%,rgba(var(--fg-rgb),.12) 88%,transparent)}
.d-tk{all:unset;box-sizing:border-box;position:absolute;left:0;top:var(--y);height:8px;margin-top:-4px;width:38px;display:flex;align-items:center;padding-left:10px;cursor:pointer}
.d-tk i{display:block;height:2px;width:calc(9px + 15px * var(--k,0));background:rgba(var(--fg-rgb),calc(.42 + .45 * var(--k,0)));border-radius:2px;transition:width 90ms,background .15s,height .2s}
.d-tk[aria-current="true"] i{background:var(--accent);height:3px;width:26px;box-shadow:0 0 8px rgba(var(--glow),.5)}
.d-tk:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.d-rail.fresh .d-tk{animation:tkIn .5s var(--e) both;animation-delay:calc(var(--i) * 14ms)}
@keyframes tkIn{from{opacity:0;translate:-10px 0}}
.d-now{position:absolute;left:44px;top:0;translate:0 calc(var(--y,0px) - 50%);font:600 11px var(--sans);letter-spacing:.04em;color:var(--accent);white-space:nowrap;transition:translate .6s var(--e);pointer-events:none}
.d-mo{position:absolute;left:44px;top:0;translate:0 calc(var(--y,0px) - 50%);font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tert);transition:opacity .25s;pointer-events:none}
.d-mo.hid{opacity:0}
.d-rail .lbl{position:absolute;left:calc(100% + 2px);top:0;translate:0 calc(var(--y,0px) - 50%);width:max-content;max-width:260px;font:500 12px/1.3 var(--sans);background:var(--glass);border:1px solid rgba(var(--fg-rgb),.14);backdrop-filter:blur(14px) saturate(160%);border-radius:8px;padding:7px 10px;opacity:0;pointer-events:none;transition:translate .16s var(--e),opacity .12s;box-shadow:var(--pop-shadow);z-index:2}
.d-rail .lbl span{color:var(--accent);margin-left:4px}
.d-rail .lbl em{display:block;font:600 14px/1.25 var(--serif);font-style:normal;margin-top:3px}
.d-rail[data-hot="true"] .lbl{opacity:1}
/* calendario nell'indice */
.d-cal{flex:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.d-cal-h{display:flex;gap:16px;align-items:baseline;justify-content:space-between;margin-bottom:8px;min-height:18px}
.d-cal-i{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.d-cal-i b{color:var(--fg)}
.d-cal-i span{color:var(--accent)}
.d-cal-g{display:grid;grid-template-columns:repeat(46,minmax(0,1fr));gap:2px;height:46px}
.dc{all:unset;cursor:pointer;position:relative;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;transition:background .15s}
.dc::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:4px;background:rgba(var(--fg-rgb),.18)}
.dc i{display:block;width:5px;height:5px;border-radius:3px;background:transparent;transition:height .4s var(--e),background .25s}
.dc.has i{background:rgba(var(--fg-rgb),.22)}
.dc.hi i{background:var(--accent);height:22px}
.dc.cur i{background:var(--fg);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.dc:hover,.dc:focus-visible{background:rgba(var(--glow),.08)}
.dc:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.d-cal-m{position:relative;height:16px;margin-top:4px;font:600 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tert)}
.d-cal-m span{position:absolute;top:0;white-space:nowrap}
.d-cal-m .r{right:0;color:var(--accent)}
/* mobile: linea del tempo */
.frame[data-variant="d"][data-layout="m"] .steps{left:14px;right:14px;transform:none;justify-content:space-between}
.frame[data-variant="d"][data-layout="m"] .cnt{display:none}
.d-tl{position:absolute;left:70px;right:70px;top:var(--stepsy);height:44px;z-index:9;touch-action:none;cursor:pointer;border-radius:8px}
.d-tl::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:1px;background:rgba(var(--fg-rgb),.14)}
.d-tl-tk i{position:absolute;left:var(--x);bottom:12px;width:2px;height:8px;margin-left:-1px;border-radius:1px;background:rgba(var(--fg-rgb),.32);transition:height .3s var(--e),background .2s}
.d-tl-tk i.on{height:20px;background:var(--accent);box-shadow:0 0 8px rgba(var(--glow),.55)}
.d-tl.fresh .d-tl-tk i{animation:tlIn .45s var(--e) both;animation-delay:calc(var(--i) * 12ms)}
@keyframes tlIn{from{opacity:0;translate:0 6px}}
.d-tl-now{position:absolute;top:0;left:var(--x,50%);translate:-50% 0;font:600 11px var(--sans);color:var(--accent);white-space:nowrap;transition:left .5s var(--e);pointer-events:none}
.d-tl.drag .d-tl-now{transition:none}
.d-tl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Fine sezione: pannello leggero (tutte le varianti) ---------- */
.end-pan{position:absolute;width:min(calc(var(--cw) * .9),460px);left:calc(var(--R) - min(calc(var(--cw) * .9),460px) / 2);top:0;translate:0 -50%;box-sizing:border-box;padding:20px 22px;border-radius:14px;background:rgba(var(--surface-rgb),.92);backdrop-filter:blur(10px);border:1px solid rgba(var(--fg-rgb),.1);display:flex;flex-direction:column;gap:10px;opacity:.35;transition:opacity var(--turn) var(--ei),box-shadow .6s var(--e)}
.slot[data-focused="true"] .end-pan{opacity:1;box-shadow:0 18px 40px -20px rgba(var(--fg-rgb),.25)}
.frame[data-layout="m"] .end-pan{left:calc(min(calc(var(--cw) * .9),420px) / -2);width:min(calc(var(--cw) * .9),420px);top:calc(-1 * var(--R))}
.end-k{margin:0;font:var(--label);letter-spacing:var(--label-ls);text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.end-up{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;padding:10px;margin:2px -10px 0;border-radius:12px;background:rgba(var(--glow),.07);transition:background .2s}
.end-up:hover{background:rgba(var(--glow),.13)}
.end-up:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up-th{position:relative;width:112px;height:72px;border-radius:8px;overflow:hidden;background:var(--ph-bg)}
.up-play{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(6,14,17,.72);color:#fff;font:600 13px var(--sans);transition:scale .25s var(--e)}
.end-up:hover .up-play{scale:1.12}
.up-tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.up-lab{font:500 12px/1.3 var(--sans);color:var(--muted)}
.up-lab b{color:var(--accent);font-weight:650}
.up-t{font:600 17px/1.22 var(--serif);color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.up-b{font-size:12px;color:var(--muted)}
.frame[data-layout="m"] .end-up{grid-template-columns:84px minmax(0,1fr);gap:12px}
.frame[data-layout="m"] .up-th{width:84px;height:64px}
.frame[data-layout="m"] .up-t{font-size:15px}
.frame[data-layout="m"] .end-pan .end-sum{font-size:15px}
.end-pan .end-sum{margin:0;font:400 17px/1.4 var(--serif-text);color:var(--fg)}
.end-pan .end-act{margin-top:4px}
.end-pan .reset{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;border-bottom:1px solid currentColor}
.end-pan .reset:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- Variante E · Menu QN ---------- */
.e-row{position:absolute;left:0;right:0;top:var(--hh);height:56px;z-index:46;background:var(--surface);border-bottom:1px solid rgba(var(--fg-rgb),.08)}
.e-row-in{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;min-width:0}
.e-pill{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border-radius:999px;background:var(--qn-chip);color:#fff;font:500 14px var(--sans);transition:background .2s}
.e-pill:hover{background:#113c6f}
.e-pill .g{display:flex;color:#8cc9ff}
.e-pill .ch svg{display:block;rotate:180deg;transition:rotate .35s var(--e)}
.e-pill[aria-expanded="true"] .ch svg{rotate:0deg}
.e-pill:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.e-sub{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 12px;border-radius:999px;background:rgba(var(--glow),.1);color:var(--qn-mark);font:600 13px var(--sans);flex:none}
.e-sub[hidden]{display:none}
.e-sub button{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.e-sub button:hover{background:rgba(var(--glow),.15)}
.e-sub button:focus-visible{outline:2px solid var(--accent)}
.e-links{list-style:none;margin:0;padding:0;display:flex;align-items:stretch;height:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.e-links::-webkit-scrollbar{display:none}
.e-lk{all:unset;box-sizing:border-box;cursor:pointer;position:relative;height:100%;display:flex;align-items:center;gap:6px;padding:0 13px;white-space:nowrap;font:500 15px var(--sans);color:var(--fg)}
/* il grassetto non sposta le voci: la larghezza è già riservata dalla versione bold */
.e-lk .t{display:inline-grid}
.e-lk .t::after{content:attr(data-t);font-weight:600;height:0;visibility:hidden;overflow:hidden}
.e-lk .n{font:500 12px var(--sans);color:var(--tert);font-variant-numeric:tabular-nums;transition:color .2s}
.e-lk:hover .t,.e-lk.peek .t,.e-lk[aria-current="true"] .t{font-weight:600}
.e-lk[aria-current="true"] .n{color:var(--qn-mark)}
.e-lk::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--qn-mark);transform:scaleX(0);transition:transform .35s var(--e)}
.e-lk[aria-current="true"]::after{transform:scaleX(1)}
.e-lk[data-empty]{color:var(--tert)}
.e-lk:focus-visible{outline:2px solid var(--accent);outline-offset:-8px;border-radius:8px}
/* layer */
.e-scrim{position:absolute;left:0;right:0;bottom:0;top:calc(var(--hh) + 56px);z-index:44;background:rgba(var(--surface-rgb),.6);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.e-scrim.on{opacity:1}
.e-layer{position:absolute;left:0;right:0;top:calc(var(--hh) + 56px);z-index:45;background:var(--surface);border-bottom:1px solid rgba(var(--fg-rgb),.08);box-shadow:0 40px 60px -40px rgba(0,30,60,.3);clip-path:inset(0 0 100% 0);transition:clip-path .45s var(--e)}
.e-layer.on{clip-path:inset(0 0 -80px 0)}
.e-layer-in{position:relative;max-width:1040px;margin:0 auto;box-sizing:border-box;padding:26px 32px 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:48px;max-height:calc(var(--fh) - var(--hh) - 80px);overflow:auto}
.e-hn{font:600 13px var(--sans);color:var(--accent);vertical-align:4px;margin-left:4px;font-variant-numeric:tabular-nums}
.e-c3 .e-arts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;margin-bottom:0}
.e-c3 .e-art:nth-last-child(-n+2){border-bottom:0}
.e-scrim{pointer-events:none}
.e-h{margin:0 0 14px;font:600 26px/1.1 var(--serif);letter-spacing:-.01em}
.e-secs{list-style:none;margin:0 0 0 -10px;padding:0;display:flex;flex-direction:column;gap:2px}
.e-sec{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;font:450 15px var(--sans);transition:background .15s,color .15s}
.e-sec .n{font:500 12px var(--sans);color:var(--tert);font-variant-numeric:tabular-nums}
.e-sec:hover{background:var(--bg-2)}
.e-sec[aria-pressed="true"]{background:rgba(var(--glow),.09);color:var(--qn-mark);font-weight:650}
.e-sec[aria-pressed="true"] .n{color:var(--accent)}
.e-sec.is-cur .t::after{content:"in lettura";margin-left:8px;font:600 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);vertical-align:2px}
.e-sec[data-empty]{color:var(--tert)}
.e-sec:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.e-c2 > *,.e-c3 > *{animation:pvIn .4s var(--e) both}
.e-c3 > *:nth-child(2){animation-delay:40ms}.e-c3 > *:nth-child(3){animation-delay:80ms}
.e-desc{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
.e-lab{margin:0 0 10px;font:var(--label);letter-spacing:var(--label-ls);text-transform:uppercase;color:var(--muted)}
.e-chips{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.e-chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;background:var(--qn-chip);color:#fff;font:500 14px var(--sans);transition:background .2s}
.e-chip span{font-size:12px;color:#8cc9ff;font-variant-numeric:tabular-nums}
.e-chip:hover{background:var(--accent)}
.e-chip:hover span{color:#fff}
.e-chip[aria-current="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.e-chip:disabled{cursor:default;background:var(--bg-2);color:var(--tert)}
.e-chip:disabled span{color:var(--tert)}
.e-chip:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.e-arts{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column}
.e-art{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--hair)}
.e-art .th{position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;background:var(--ph-bg)}
.e-art .th svg{position:absolute;inset:0;width:100%;height:100%}
.e-art .k{display:block;font:500 12px var(--sans);color:var(--accent);margin-bottom:4px}
.e-art .tt2{display:block;font:600 17px/1.22 var(--serif);text-wrap:balance}
.e-art .b{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.e-art:hover .tt2{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:1px}
.e-art:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.e-open{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:var(--fg);color:var(--bg);font:600 14px var(--sans);transition:background .2s}
.e-open .n{font-size:12px;color:inherit;opacity:.65}
.e-open:hover{background:var(--accent)}
.e-open:hover .n{color:#fff}
.e-open:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.e-none{margin:0;color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--hair);border-radius:10px}
.e-x{all:unset;cursor:pointer;position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2)}
.e-x:hover{background:#edeff2}
.e-x:focus-visible{outline:2px solid var(--accent)}
/* cronologia desktop */
.e-rail{position:absolute;left:0;width:38px;z-index:9;cursor:pointer;touch-action:none}
.e-tk{all:unset;box-sizing:border-box;position:absolute;left:0;top:0;translate:0 calc(var(--y,0px) - 50%);height:13px;width:38px;display:flex;align-items:center;padding-left:10px;cursor:pointer;transition:translate .5s var(--e),opacity .3s}
.e-tk i{display:block;height:2px;width:calc(10px + 14px * var(--k,0));background:rgba(var(--fg-rgb),calc(.4 + .45 * var(--k,0)));border-radius:2px;transition:width 90ms,background .15s}
.e-tk.today i{background:#7fb0e3}
.e-tk[aria-current="true"] i{width:24px;height:3px;background:var(--accent)}
.e-tk.out{opacity:0;pointer-events:none}

      how:['Hover e focus aggiornano l’anteprima senza selezionare, con un piccolo ritardo per evitare sfarfallii.','Clic su una sezione: chiude e filtra. Clic su un titolo in anteprima: apre la sezione già su quell’articolo.','Mobile: pill nella zona del pollice, bottom sheet con anteprime a fisarmonica (niente hover); si chiude trascinando verso il basso.'],
      pro:['La più ricca per scoprire i contenuti e capire la tassonomia (descrizioni visibili).','Scala oltre 10 sezioni senza cambiare struttura.','Il rail mantiene un accesso rapido a riposo.'],
      risk:['Un clic in più per vedere le sezioni.','A riposo la sezione attiva si legge solo nel trigger.','L’overlay nasconde la proposta del giorno mentre è aperto.'],
      scale:'Il corpo delle voci si calcola su altezza e numero di sezioni (da 46px con 5 a ~30px con 10).'},
  c: {model:'Navigazione persistente. Le sezioni sono sempre visibili in una banda sotto l’header, con un indicatore che scorre (con il “blip” del radar) fino alla sezione attiva. Su desktop il pattern priority+ mette in “Altro” le voci che non entrano; se la sezione attiva è lì dentro, il suo nome compare sul pulsante.',
      how:['Sosta di circa 0,4s su una sezione: anteprima con ultimo titolo, firma e data. Le anteprime successive compaiono subito.','Mobile: banda in basso, scorrevole con snap, la voce attiva si centra da sola; il pulsante a griglia apre tutte le sezioni.'],
      pro:['Zero clic per sapere quali sezioni esistono.','Stato attivo sempre leggibile.','Pattern familiare, il più semplice da sviluppare.'],
      risk:['La meno immersiva: aggiunge una fascia e riduce l’altezza della ruota.','Con 10 sezioni sotto i ~1100px parte del menu finisce in “Altro”.','Su mobile la banda compete con le frecce della ruota.'],
      scale:'5 sezioni stanno sempre in riga. Con 10 le voci in eccesso vanno in “Altro” su desktop e nello scorrimento orizzontale su mobile.'},
  d: {model:'Le sezioni sono il filtro primario, la data è l’ordinamento e l’orientamento. La vista di partenza è “Tutte”: l’intero archivio dal più recente, con i pezzi di oggi in cima, così la proposta del giorno resta il punto d’ingresso senza che la data diventi un filtro. La banda mostra le 5 sezioni con il numero di pezzi e, sotto la sezione attiva, quanto ne hai già visto. L’indice si apre dalla banda e aggiunge le anteprime e un calendario delle ultime settimane.',
      how:['Tacche accanto a “Radar”: una per approfondimento, distanziate secondo la data reale (più spazio = più giorni senza uscite). La tacca lunga e l’etichetta azzurra indicano la data del pezzo che stai leggendo; il passaggio del mouse mostra data e titolo, il clic porta lì. Cambiando sezione le tacche si ricompongono.','Calendario nell’indice: le barre azzurre sono i giorni con pezzi della sezione in anteprima. Passando su un’altra sezione si vede subito come si distribuisce nel tempo. Clic su un giorno: entri nella sezione da quella data (il pezzo più vicino).','Fine sezione: dopo l’ultimo pezzo compare una card che chiude la sezione e propone la successiva, con il primo titolo. La freccia, la rotella o lo swipe proseguono senza interruzioni; nella banda la sezione successiva pulsa.','Mobile: la pill dell’Indice resta il menu contratto; tra le frecce c’è la linea del tempo della sezione, trascinabile con il pollice.'],
      pro:['Doppio livello sezione + data senza che la data torni a essere il filtro primario.','I numeri per sezione sono visibili a riposo.','Riusa il rail di tacche che il pubblico conosce già, con un significato più ricco.','La lettura scorre da una sezione all’altra senza tornare al menu.'],
      risk:['Le tacche distanziate per data diventano fitte con molti pezzi: oltre ~60 per sezione vanno raggruppate per settimana.','Sezione + calendario nell’indice richiedono altezza: sotto i 620px il calendario va ridotto.','Va deciso cosa fa “Prossima sezione” dopo l’ultima (ora ricomincia dalla prima) e se le sezioni vuote vanno saltate (ora sì).','Il passaggio automatico tra sezioni va testato: c’è il rischio che l’utente non si accorga del cambio.'],
      scale:'Pensata per 5 sezioni, che stanno sempre in riga con il pulsante Indice. Con 10 funziona grazie a “Altro”, ma la banda perde leggibilità.'},
  e: {model:'Razionalizzazione di D. Architettura su tre livelli e un solo ingresso: Sezione → Sottosezione → Articolo, con la data come ordinamento. Su desktop c’è una sola banda di sezioni, centrata sotto l’header, senza select: ogni voce è insieme anteprima (al passaggio) e accesso (al clic). La sezione attiva è indicata solo dal grassetto e da una barra sul bordo inferiore della banda.',
      how:['Passaggio su una sezione: dopo un breve ritardo si apre il pannello, 1/3 sezione con descrizione e sottosezioni, 2/3 ultimi pezzi. Passando da una voce all’altra il pannello resta aperto e cambia contenuto; uscendo si chiude.','Clic sulla voce: apre la sezione. Dal pannello si entra anche da un articolo o da una sottosezione.','Tastiera: ←→ tra le voci, Invio apre, ↓ entra nel pannello, Esc torna alla voce.','Una sottosezione è un filtro dentro la sezione: compare come chip rimovibile accanto alla banda.','Cronologia: tacche a passo regolare (non più proporzionali alla data). L’altezza dipende dal numero di pezzi; oltre lo spazio disponibile si vede una finestra che scorre con il pezzo corrente. Accanto al pezzo corrente la data: “OGGI” in evidenza, poi “ieri”, poi la data.','Fine sezione: un pannello leggero, diverso da una card, con “Continua con…” e “Torna a Tutte”. Scorrendo oltre non succede nulla.','Tornare indietro: il tasto Indietro del browser riporta alla sezione precedente; ogni sezione ricorda il pezzo a cui eri arrivato.','Mobile: header più alto (come quello ufficiale), “Radar” sopra la card. In basso una pulsantiera: freccia, pill (blu QN, con sezione e posizione “3/7”), freccia. Nello sheet “Tutte” è una voce semplice; la sezione attiva è sottolineata in azzurro e non ha pulsante; le altre hanno sottosezioni, ultimi e “Apri”.'],
      pro:['Nessuna ripetizione: le sezioni compaiono una volta sola, ogni voce porta anche alla sua anteprima.','Linguaggio già noto agli utenti della home QN.','Le sottosezioni sono visibili, senza aggiungere un terzo menu.','Fine sezione e ritorno indietro sono prevedibili.'],
      risk:['L’anteprima al passaggio non esiste su touch: su tablet il primo tocco apre direttamente la sezione.','Le sottosezioni vuote (es. Industria, Città) vanno mostrate o nascoste? Ora sono visibili ma disattivate.','Va deciso se le sottosezioni sono filtri (come qui) o pagine d’archivio separate.','Il ruolo della data va riconsiderato con i volumi reali (oggi 4–5 pezzi al giorno): filtro per giorno, solo indicazione o niente. Con molti più pezzi servirà anche il caricamento progressivo.'],
      scale:'Con 5 sezioni i link stanno sempre nella barra. Con 10 la barra scorre in orizzontale; il layer regge senza modifiche.'},
};
function renderDesc() {
  const d = DESC[S.variant];
  $('#desc').innerHTML = `<strong>${d[0]}</strong><span>${d[1]}</span><span class="how">${d[2]}</span>`;
  const n = NOTES[S.variant];
  $('#notes').innerHTML = `<button class="x" aria-label="Chiudi note">${plus.replace('<svg', '<svg style="rotate:45deg"')}</button>
    <h2>${d[0]}</h2><h3>Modello</h3><p>${n.model}</p><h3>Interazioni</h3><ul>${n.how.map(x => `<li>${x}</li>`).join('')}</ul>
    <h3>Punti di forza</h3><ul>${n.pro.map(x => `<li>${x}</li>`).join('')}</ul><h3>Rischi da verificare</h3><ul>${n.risk.map(x => `<li>${x}</li>`).join('')}</ul>
    <h3>Da 5 a 10 sezioni</h3><p>${n.scale}</p>
    <div class="gen"><h3>Comune alle tre varianti</h3><ul>
      <li>A, B, C partono da “In evidenza” (proposta del giorno, ultimi 9 pezzi); D parte da “Tutte” (archivio in ordine cronologico).</li>
      <li>In tutte le varianti, dopo l’ultimo pezzo di una sezione compare un pannello “Fine di…” con “Continua con…” (salta le sezioni vuote) e “Torna a…”. Non c’è passaggio automatico.</li>
      <li>In tutte le varianti ogni sezione ricorda il pezzo a cui eri arrivato e il tasto Indietro del browser riporta alla sezione precedente.</li>
      <li>Il cambio di sezione usa lo stesso movimento in tutte: impulso radar dal centro e ruota che gira via, così la transizione si legge come “nuova scansione”.</li>
      <li>Contenuti reali: i 40 approfondimenti pubblicati su quotidiano.net/radar dal 18 al 25 novembre 2026, con titoli, occhielli, lead, firme e foto originali. La classificazione in sezioni e sottosezioni è una proposta mia, da validare con la redazione. Con 5 sezioni nessuna è vuota; restano vuote alcune sottosezioni (es. Clima, Energia).</li>
      <li>Con 5 sezioni gli articoli vengono riassegnati secondo la tabella del brief (es. Politica → Geopolitica, Salute → Società).</li>
      <li>Lo stato è nell’URL (#variante-sezioni-vista-sezione) per condividere una configurazione precisa.</li>
      <li>Tema scuro: usa i token “strip-radar” già presenti nel CSS di produzione (fondo #060e11, card #0b181d, testo #dfe8ec, accento #1fbaed). In “Auto” segue prefers-color-scheme del sistema, che oggi la pagina live ignora. Le miniature segnaposto sono invertite per il dark; le foto reali andranno gestite a parte (al massimo una leggera riduzione di luminosità).</li>
      <li>Font: QN Shinka Display non è caricabile qui, si usa Source Serif 4 come sostituto (o Shinka, se è installato in locale).</li></ul></div>`;
  on($('#notes .x'), 'click', () => toggleNotes(false));
}
function toggleNotes(o) { $('#notes').classList.toggle('open', o); $('#notesBtn').setAttribute('aria-expanded', o); if (o) $('#notes .x').focus(); }

/* ---------------- Hash ---------------- */
// Cambio sezione = nuova voce nella cronologia del browser (Indietro riporta alla sezione precedente)
function writeHash(push) {
  const h = `#${S.variant}-${S.tax}-${S.view}-${S.cat}${S.sub ? '-' + slug(S.sub) : ''}`;
  if (location.hash === h) return;
  try { if (push) history.pushState(null, '', h); else history.replaceState(null, '', h); } catch (e) { /* ignorato */ }
}
function parseHash() {
  const p = location.hash.slice(1).split('-'); if (!p[0]) return null;
  const o = {variant:S.variant, tax:S.tax, view:S.view, cat:S.cat, sub:null};
  if (VARIANTS[p[0]]) o.variant = p[0];
  if (p[1] === '5' || p[1] === '10') o.tax = +p[1];
  if (p[2] === 'desktop' || p[2] === 'mobile') o.view = p[2];
  if (p[3]) o.cat = p[3];
  if (p[4]) o.sub = [...Object.values(SUBS5).flat(), ...ART.map(a => a.kicker)].find(n => slug(n) === p[4]) || null;
  return o;
}
function readHash() { const o = parseHash(); if (o) Object.assign(S, o); }
function onHistory() {
  const o = parseHash(); if (!o) return;
  if (o.variant !== S.variant || o.tax !== S.tax || o.view !== S.view) { Object.assign(S, o); rebuild(); return; }
  if (o.cat !== S.cat || o.sub !== S.sub) select(o.cat, {sub: o.sub, fromHistory: true});
}

/* ---------------- Montaggio ---------------- */
function rebuild() {
  cleanups.forEach(f => f()); cleanups = [];
  document.body.dataset.view = S.view;
  frame.dataset.variant = S.variant;
  document.documentElement.classList.toggle('rm', S.rm);
  $$('#segVariant button').forEach(b => b.setAttribute('aria-checked', b.dataset.v === S.variant));
  $$('#segTax button').forEach(b => b.setAttribute('aria-checked', +b.dataset.t === S.tax));
  $$('#segView button').forEach(b => b.setAttribute('aria-checked', b.dataset.w === S.view));
  if (!cats().some(c => c.id === S.cat)) S.cat = RESET().id;
  if (S.variant !== 'e') S.sub = null;
  S.idx = clamp(S.idx, 0, Math.max(0, curList().length - 1));
  geometry();
  nav = VARIANTS[S.variant]; navRoot.innerHTML = ''; hdrR.innerHTML = '';
  frame.classList.add('init-nav');
  nav.mount(); renderWheel(0); nav.layout(); nav.update();
  requestAnimationFrame(() => requestAnimationFrame(() => frame.classList.remove('init-nav')));
  renderDesc(); writeHash(); lastLayout = G.m;
}
let lastLayout = null;
function relayout() {
  const was = lastLayout; geometry();
  if (G.m !== was) { rebuild(); return; }
  nav.layout(); updateOffsets();
}

/* Toolbar */
$('#segVariant').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.v === S.variant) return; S.variant = b.dataset.v; rebuild(); });
$('#segTax').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || +b.dataset.t === S.tax) return;
  const nt = +b.dataset.t; if (!isReset(S.cat)) S.cat = nt === 5 ? TO5[S.cat] : (CATS10.some(c => c.id === S.cat) ? S.cat : RESET().id);
  S.tax = nt; S.sub = null; S.idx = 0; rebuild(); });
$('#segView').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.w === S.view) return; S.view = b.dataset.w; document.body.dataset.view = S.view; requestAnimationFrame(rebuild); });
$('#rmBtn').addEventListener('click', () => { S.rm = !S.rm; $('#rmBtn').setAttribute('aria-pressed', S.rm); document.documentElement.classList.toggle('rm', S.rm); });
/* Tema: Auto segue il sistema (o il tema esplicito della pagina che ospita il prototipo) */
const darkQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const host = document.documentElement.getAttribute('data-theme');
  const dark = S.theme === 'dark' || (S.theme === 'auto' && (host ? host === 'dark' : darkQ.matches));
  frame.dataset.theme = dark ? 'dark' : 'light';
  document.body.dataset.stageTheme = dark ? 'dark' : 'light';
  $$('#segTheme button').forEach(b => {
    b.setAttribute('aria-checked', b.dataset.th === S.theme);
    if (b.dataset.th === 'auto') b.textContent = S.theme === 'auto' ? `Auto · ${dark ? 'scuro' : 'chiaro'}` : 'Auto';
  });
}
$('#segTheme').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.th; try { localStorage.setItem('radar-lab-theme', S.theme); } catch (er) { /* ignorato */ } applyTheme(); });
darkQ.addEventListener?.('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
try { const t = localStorage.getItem('radar-lab-theme'); if (t === 'light' || t === 'dark' || t === 'auto') S.theme = t; } catch (er) { /* ignorato */ }
applyTheme();
$('#notesBtn').addEventListener('click', () => toggleNotes(!$('#notes').classList.contains('open')));
// tastiera sui radiogroup della toolbar
$$('.seg').forEach(g => g.addEventListener('keydown', e => { if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return; const bs = $$('button', g), i = bs.indexOf(document.activeElement); const n = bs[clamp(i + (e.key === 'ArrowRight' ? 1 : -1), 0, bs.length - 1)]; n.focus(); n.click(); }));

/* Ruota: frecce, rotella, swipe, clic */
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
let wAcc = 0, wLock = 0;
frame.addEventListener('wheel', e => {
  if (e.target.closest('.dial, .a-hit, .idx, .sheet, .c-menu, .c-tabs, .c-grid, .b-rail, .d-rail, .d-tl, .e-rail, .e-strip, .e-layer, .e-row')) return;
  e.preventDefault(); const now = performance.now();
  wAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(wAcc) < 45 || now < wLock) return;
  step(Math.sign(wAcc)); wAcc = 0; wLock = now + 420;
}, {passive:false});
let pd = null;
zone.addEventListener('pointerdown', e => { pd = {x: e.clientX, y: e.clientY, moved: false}; });
zone.addEventListener('pointermove', e => { if (pd && Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 10) pd.moved = true; });
zone.addEventListener('pointerup', e => { if (!pd) return; const dx = e.clientX - pd.x, dy = e.clientY - pd.y; const p = pd; pd = null;
  if (G.m && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { step(dx < 0 ? 1 : -1); zone.dataset.sw = '1'; setTimeout(() => delete zone.dataset.sw, 60); }
  else if (!G.m && Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)) { step(dy < 0 ? 1 : -1); zone.dataset.sw = '1'; setTimeout(() => delete zone.dataset.sw, 60); } });
zone.addEventListener('click', e => {
  if (zone.dataset.sw) return;
  if (e.target.closest('.reset')) { select(RESET().id); return; }
  if (e.target.closest('.to-start')) { S.idx = 0; updateOffsets(); writeHash(); return; }
  if (e.target.closest('.clear-sub')) { select(S.cat, {sub: null, dir: -1}); return; }
  if (e.target.closest('.go-next')) { goNext(); return; }
  const slot = e.target.closest('.slot'); if (!slot) return;
  const i = +slot.dataset.i;
  if (i !== S.idx) { S.idx = i; updateOffsets(); writeHash(); return; }
  if (e.target.closest('.open')) toast('Apertura dell’articolo: fuori dal perimetro di questo prototipo');
});
frame.addEventListener('keydown', e => {
  if (e.target.closest('[role="tablist"], .idx, .sheet, .c-menu, .c-grid, .b-rail, .d-rail, .d-tl, .e-rail, .e-strip, .e-layer, .e-row')) return;
  const nextK = G.m ? 'ArrowRight' : 'ArrowDown', prevK = G.m ? 'ArrowLeft' : 'ArrowUp';
  if (e.key === nextK) { e.preventDefault(); step(1); } else if (e.key === prevK) { e.preventDefault(); step(-1); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#notes').classList.contains('open')) { toggleNotes(false); return; }
  if (nav?.isOpen && nav.close) nav.close();
});
window.addEventListener('hashchange', onHistory);
window.addEventListener('popstate', onHistory);
rmQ.addEventListener?.('change', () => {});

/* Avvio */
if (matchMedia('(max-width: 760px)').matches) S.view = 'mobile';
readHash();
new ResizeObserver(() => { cancelAnimationFrame(relayout.r); relayout.r = requestAnimationFrame(() => lastLayout === null ? null : relayout()); }).observe(frame);
document.fonts?.ready.then(() => nav && nav.layout());
rebuild();
})();
</script>
